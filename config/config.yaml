# VLM auto annotation runtime configuration.
#
# This YAML file is the single source of default runtime parameters.
# utils/config.py only loads this file and exposes compatibility constants.
#
# Optional environment variables can still override values temporarily:
# - ANNOTATE_CONFIG: path to another YAML config file
# - ANNOTATE_API_KEY
# - ANNOTATE_MODEL
# - ANNOTATE_BASE_URL
# - ANNOTATE_ROBOT_TYPE
# - ANNOTATE_PROMPT_LANGUAGE
# - ANNOTATE_SCENE_FPS
# - ANNOTATE_ANALYSIS_FPS
# - ANNOTATE_REFINEMENT_FPS
# - ANNOTATE_SCENE_INPUT_MODE
# - ANNOTATE_ANALYSIS_INPUT_MODE
# - ANNOTATE_REFINEMENT_INPUT_MODE
# - ANNOTATE_SAVE_PROCESSED_STAGES
# - ANNOTATE_SAVE_PROCESSED_DIR
# - ANNOTATE_SCENE_MAX_TOKENS
# - ANNOTATE_ANALYSIS_MAX_TOKENS
# - ANNOTATE_REFINEMENT_MAX_TOKENS
# - ANNOTATE_SCENE_MAX_FRAMES
# - ANNOTATE_ANALYSIS_MAX_FRAMES
# - ANNOTATE_REFINEMENT_MAX_FRAMES
# - ANNOTATE_SCENE_MERGE_VIEW_NAMES
# - ANNOTATE_ANALYSIS_MERGE_VIEW_NAMES
# - ANNOTATE_REFINEMENT_MERGE_VIEW_NAMES
# - ANNOTATE_SCENE_JPEG_QUALITY
# - ANNOTATE_ANALYSIS_JPEG_QUALITY
# - ANNOTATE_REFINEMENT_JPEG_QUALITY
# - ANNOTATE_SCENE_MIN_API_FRAMES
# - ANNOTATE_ANALYSIS_MIN_API_FRAMES
# - ANNOTATE_REFINEMENT_MIN_API_FRAMES
# - ANNOTATE_SCENE_MERGE_VIEWS
# - ANNOTATE_ANALYSIS_MERGE_VIEWS
# - ANNOTATE_REFINEMENT_MERGE_VIEWS
# - ANNOTATE_SCENE_MERGE_MODE
# - ANNOTATE_ANALYSIS_MERGE_MODE
# - ANNOTATE_REFINEMENT_MERGE_MODE
# - ANNOTATE_MERGE_VIEWS: compatibility override for all stage merge switches
# - ANNOTATE_MERGE_MODE: compatibility override for all stage merge modes
# - ANNOTATE_VLM_TEMPERATURE
# - ANNOTATE_VLM_TOP_P
# - ANNOTATE_VLM_TOP_K
# - ANNOTATE_MAX_FRAMES
# - ANNOTATE_SCENE_RESIZE_WIDTH
# - ANNOTATE_ANALYSIS_RESIZE_WIDTH
# - ANNOTATE_REFINEMENT_RESIZE_WIDTH
# - ANNOTATE_RESIZE_WIDTH
# - ANNOTATE_MERGE_VIEW_NAMES
# - ANNOTATE_JPEG_QUALITY
# - ANNOTATE_SCENE_DRAW_TIMESTAMPS
# - ANNOTATE_ANALYSIS_DRAW_TIMESTAMPS
# - ANNOTATE_REFINEMENT_DRAW_TIMESTAMPS
# - ANNOTATE_DRAW_TIMESTAMPS
# - ANNOTATE_MIN_API_FRAMES
# - ANNOTATE_MAX_STEP_WORKERS
# - ANNOTATE_LOG_LEVEL
# - ANNOTATE_LOG_FORMAT

model:
  # DEFAULT_API_KEY: API key for the OpenAI-compatible API.
  api_key: EMPTY
  # DEFAULT_MODEL: served model name sent to the OpenAI-compatible API.
  name: Qwen3.6-27B
  # DEFAULT_BASE_URL: OpenAI-compatible API base URL.
  base_url: http://localhost:8002/v1


vlm_sampling:
  # DEFAULT_VLM_TEMPERATURE: lower is more deterministic.
  temperature: 0.0
  # DEFAULT_VLM_TOP_P: nucleus sampling parameter.
  top_p: 0.95
  # DEFAULT_VLM_TOP_K: 0 means do not explicitly send top_k.
  top_k: 0

prompt:
  # DEFAULT_PROMPT_LANGUAGE: cn uses prompts/prompts_cn, en uses prompts/prompts_en.
  language: cn
  # DEFAULT_ROBOT_TYPE: single_arm, bimanual, mobile_manipulator, or unknown.
  robot_type: bimanual

processed_media:
  # DEFAULT_SAVE_PROCESSED_STAGES: stages whose final visual inputs are saved.
  # Allowed values: scene, analysis, refinement. Empty list disables saving.
  save_processed_stages: []
  # DEFAULT_SAVE_PROCESSED_DIR: root directory for saved processed media.
  # Required when save_processed_stages is non-empty.
  save_processed_dir: ""

stages:
  scene:
    # DEFAULT_SCENE_INPUT_MODE: image_sequence or video.
    input_mode: image_sequence
    # DEFAULT_SCENE_FPS: frame sampling FPS for scene/background context extraction.
    fps: 1.0
    # DEFAULT_SCENE_MAX_TOKENS: max output tokens for scene context.
    max_tokens: 1024
    # DEFAULT_SCENE_MAX_FRAMES: maximum sampled frames sent to scene stage.
    max_frames: 24
    # DEFAULT_SCENE_RESIZE_WIDTH: per-view image width before optional multi-view merge.
    resize_width: 224
    # DEFAULT_SCENE_MERGE_VIEW_NAMES: selected views for scene stage.
    # The first view is the primary view for left/right/front/back spatial language.
    merge_view_names:
      - camera_front
      - camera_top
    # DEFAULT_SCENE_JPEG_QUALITY: JPEG encoding quality for scene frames.
    jpeg_quality: 80
    # DEFAULT_SCENE_MIN_API_FRAMES: force at least this many scene frames when possible.
    min_api_frames: 2
    # DEFAULT_SCENE_DRAW_TIMESTAMPS: normally false; scene context does not need time boundaries.
    draw_timestamps: true
    # DEFAULT_SCENE_DRAW_VIEWPOSITION: overlay view/camera name on each frame before merge.
    draw_viewposition: true
    # DEFAULT_SCENE_MERGE_VIEWS: whether this stage uses multi-view stitching.
    merge_views: true
    # DEFAULT_SCENE_MERGE_MODE: per_frame or timeline_grid.
    # per_frame: each sampled timestamp is one vertically stitched image.
    # timeline_grid: views are arranged vertically and sampled times horizontally in one image.
    merge_mode: timeline_grid
    # DEFAULT_SCENE_MERGE_LENGTH: max time columns in timeline_grid mode; 0 means unlimited.
    merge_length: 8

  analysis:
    # DEFAULT_ANALYSIS_INPUT_MODE: image_sequence or video.
    input_mode: image_sequence
    # DEFAULT_ANALYSIS_FPS: frame sampling FPS for coarse action analysis.
    fps: 1.0
    # DEFAULT_ANALYSIS_MAX_TOKENS: max output tokens for analysis; 0 means service default.
    max_tokens: 4096
    # DEFAULT_ANALYSIS_MAX_FRAMES: maximum sampled frames sent to analysis stage.
    max_frames: 64
    # DEFAULT_ANALYSIS_RESIZE_WIDTH: per-view image width before optional multi-view merge.
    resize_width: 336
    # DEFAULT_ANALYSIS_MERGE_VIEW_NAMES: selected views for analysis stage.
    merge_view_names:
      - camera_front
      - camera_top
    # DEFAULT_ANALYSIS_JPEG_QUALITY: JPEG encoding quality for analysis frames.
    jpeg_quality: 85
    # DEFAULT_ANALYSIS_MIN_API_FRAMES: force at least this many analysis frames when possible.
    min_api_frames: 2
    # DEFAULT_ANALYSIS_DRAW_TIMESTAMPS: usually false to avoid distracting coarse recognition.
    draw_timestamps: true
    # DEFAULT_ANALYSIS_DRAW_VIEWPOSITION: overlay view/camera name on each frame before merge.
    draw_viewposition: true
    # DEFAULT_ANALYSIS_MERGE_VIEWS: whether this stage uses multi-view stitching.
    merge_views: true
    # DEFAULT_ANALYSIS_MERGE_MODE: per_frame or timeline_grid.
    merge_mode: timeline_grid
    # DEFAULT_ANALYSIS_MERGE_LENGTH: max time columns in timeline_grid mode; 0 means unlimited.
    merge_length: 4

  refinement:
    # DEFAULT_REFINEMENT_INPUT_MODE: image_sequence or video.
    input_mode: image_sequence
    # DEFAULT_REFINEMENT_FPS: frame sampling FPS for timestamp/action refinement.
    fps: 4.0
    # DEFAULT_REFINEMENT_MAX_TOKENS: max output tokens for refinement; 0 means service default.
    max_tokens: 4096
    # DEFAULT_REFINEMENT_MAX_FRAMES and DEFAULT_MAX_FRAMES compatibility value.
    max_frames: 128
    # DEFAULT_REFINEMENT_RESIZE_WIDTH and DEFAULT_RESIZE_WIDTH compatibility value.
    resize_width: 336
    # DEFAULT_REFINEMENT_MERGE_VIEW_NAMES and DEFAULT_MERGE_VIEW_NAMES compatibility value.
    merge_view_names:
      - camera_front
      - camera_top
    # DEFAULT_REFINEMENT_JPEG_QUALITY and DEFAULT_JPEG_QUALITY compatibility value.
    jpeg_quality: 20
    # DEFAULT_REFINEMENT_MIN_API_FRAMES and MIN_API_FRAMES compatibility value.
    min_api_frames: 2
    # DEFAULT_REFINEMENT_DRAW_TIMESTAMPS and DEFAULT_DRAW_TIMESTAMPS compatibility value.
    draw_timestamps: true
    # DEFAULT_REFINEMENT_DRAW_VIEWPOSITION: overlay view/camera name on each frame before merge.
    draw_viewposition: true
    # DEFAULT_REFINEMENT_MERGE_VIEWS: whether this stage uses multi-view stitching.
    merge_views: true
    # DEFAULT_REFINEMENT_MERGE_MODE: per_frame or timeline_grid.
    merge_mode: per_frame
    # DEFAULT_REFINEMENT_MERGE_LENGTH: max time columns in timeline_grid mode; 0 means unlimited.
    merge_length: 8


# 全局回退参数。当某个 stage 未配置同名项时，config.py 通过 _optional → _required 链
# 回退到此处的值。例如 stages.scene 未配 max_frames → 走 video.max_frames: 128。基本上不会使用到这些回退值，因为各 stage 都显式配置了自己的值。
# 各 stage 一旦显式配置了对应项，该 stage 就会使用自己的值，不再依赖此回退。
video:
  # 全局抽帧上限回退。各 stage 优先使用 stages.<stage>.max_frames。
  max_frames: 128
  # 全局多视角列表回退。各 stage 优先使用 stages.<stage>.merge_view_names。
  merge_view_names:
    - camera_front
    - camera_top
  # 全局 JPEG 质量回退。各 stage 优先使用 stages.<stage>.jpeg_quality。
  jpeg_quality: 75
  # 全局最小抽帧数回退。各 stage 优先使用 stages.<stage>.min_api_frames。
  min_api_frames: 2

workers:
  # MAX_STEP_WORKERS: max worker threads for parallel step processing.
  max_step_workers: 8

logging:
  # DEFAULT_LOG_LEVEL: DEBUG, INFO, WARNING, ERROR, or CRITICAL.
  level: INFO
  # DEFAULT_LOG_FORMAT: Python logging format used by CLI/debug entrypoints.
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
